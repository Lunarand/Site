name: DeadChats Server

on:
  workflow_dispatch:

jobs:
  launch-site:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🚀 Start Server & Tunnel
      env:
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }} # <--- THIS PASSES YOUR SECRET
      run: |
        npm start &
        sleep 5
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared-linux-amd64
        echo "-----------------------------------------------------"
        echo "🔗 YOUR WEBSITE URL IS BELOW:"
        echo "-----------------------------------------------------"
        ./cloudflared-linux-amd64 tunnel --url http://localhost:3000
