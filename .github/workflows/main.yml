name: DeadChats Server

on:
  workflow_dispatch:

concurrency:
  group: deadchats-tunnel
  cancel-in-progress: true

jobs:
  launch-site:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Start Server (quiet)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          nohup npm start > server.log 2>&1 &
          sleep 2
          echo "====================================================="
          echo "✅ Server is running on http://localhost:3000"
          echo "====================================================="

      - name: 🌐 Start Cloudflare Tunnel (CLEAN URL OUTPUT)
        run: |
          # Download cloudflared quietly (no progress spam)
          curl -sSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

          echo ""
          echo "====================================================="
          echo "🌍 DEADCHATS PUBLIC LINK"
          echo "====================================================="
          echo ""

          # Run tunnel and ONLY show the URL + status
          ./cloudflared tunnel --url http://localhost:3000 2>&1 | awk '
            /https:\/\/.*trycloudflare\.com/ {
              print "=====================================================";
              print "🔗 YOUR WEBSITE URL:";
              print $0;
              print "=====================================================";
              print "";
              printed=1
            }
            printed && /Registered tunnel connection/ {
              print "✅ Tunnel is LIVE. Keep this workflow running.";
              fflush()
            }
          '
