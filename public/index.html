<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadChats Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script> <!-- Icons -->
    <style>
        body { background-color: #09090b; color: #e4e4e7; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .modal-bg { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
        
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar (Sticky) -->
    <nav class="glass fixed top-0 w-full z-40 px-4 py-3">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Logo -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <i data-lucide="ghost" class="text-emerald-500 w-6 h-6"></i>
                <h1 class="font-bold text-lg tracking-tight hidden sm:block">DeadChats<span class="text-emerald-500">Files</span></h1>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i>
                <input type="text" id="searchInput" placeholder="Search posts..." 
                    class="w-full bg-zinc-900 border border-zinc-800 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all placeholder-zinc-600">
            </div>

            <!-- Upload Button -->
            <button onclick="toggleModal(true)" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-full sm:px-4 sm:py-2 flex items-center gap-2 transition-all shadow-lg shadow-emerald-900/20 flex-shrink-0">
                <i data-lucide="plus" class="w-5 h-5"></i>
                <span class="hidden sm:inline text-sm font-medium">New Post</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-3xl mx-auto pt-24 px-4 pb-20">
        
        <!-- Disclaimer -->
        <div class="mb-6 p-3 rounded-lg bg-zinc-900/50 border border-zinc-800 text-xs text-zinc-500 text-center flex items-center justify-center gap-2">
            <i data-lucide="info" class="w-3 h-3"></i>
            <span>This site is for fun/testing only. Content is wiped every 6 hours.</span>
        </div>

        <!-- Feed -->
        <div id="feed" class="space-y-6">
            <!-- Loading State -->
            <div class="text-center py-20 text-zinc-600 animate-pulse">
                Loading posts...
            </div>
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-zinc-900 mb-4">
                <i data-lucide="inbox" class="w-8 h-8 text-zinc-600"></i>
            </div>
            <h3 class="text-zinc-400 font-medium">No posts yet</h3>
            <p class="text-zinc-600 text-sm mt-1">Be the first to share something.</p>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 hidden">
        <!-- Backdrop -->
        <div class="absolute inset-0 modal-bg transition-opacity" onclick="toggleModal(false)"></div>
        
        <!-- Modal Content -->
        <div class="absolute bottom-0 sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full sm:w-[500px] bg-[#09090b] sm:rounded-2xl rounded-t-2xl border border-zinc-800 p-6 shadow-2xl transform transition-transform duration-300 translate-y-full sm:translate-y-0" id="modalPanel">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-semibold">Create Post</h2>
                <button onclick="toggleModal(false)" class="p-2 hover:bg-zinc-800 rounded-full transition">
                    <i data-lucide="x" class="w-5 h-5 text-zinc-400"></i>
                </button>
            </div>

            <form id="uploadForm" class="space-y-4">
                <textarea id="postText" placeholder="What's on your mind?" class="w-full bg-zinc-900 text-white p-4 rounded-xl border border-zinc-800 focus:outline-none focus:border-emerald-500 resize-none h-32 placeholder-zinc-600"></textarea>
                
                <!-- Image Preview -->
                <div id="imagePreview" class="hidden relative w-full h-32 bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800 group">
                    <img id="previewImg" class="w-full h-full object-cover opacity-80">
                    <button type="button" onclick="clearImage()" class="absolute top-2 right-2 bg-black/50 p-1.5 rounded-full hover:bg-red-500/80 transition">
                        <i data-lucide="trash-2" class="w-4 h-4 text-white"></i>
                    </button>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <label class="cursor-pointer p-2 hover:bg-zinc-800 rounded-full transition text-zinc-400 hover:text-emerald-400">
                        <input type="file" id="postImage" class="hidden" accept="image/*">
                        <i data-lucide="image" class="w-6 h-6"></i>
                    </label>
                    
                    <button type="submit" id="submitBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl font-medium transition shadow-lg shadow-emerald-900/20 flex items-center gap-2">
                        <span>Post</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // DOM Elements
        const modal = document.getElementById('uploadModal');
        const modalPanel = document.getElementById('modalPanel');
        const fileInput = document.getElementById('postImage');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const searchInput = document.getElementById('searchInput');
        let allPosts = []; // Store posts locally for search

        // Toggle Modal
        function toggleModal(show) {
            if (show) {
                modal.classList.remove('hidden');
                // Small animation delay for slide-up effect
                setTimeout(() => {
                    modalPanel.classList.remove('translate-y-full');
                }, 10);
            } else {
                modalPanel.classList.add('translate-y-full');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        // Image Preview Handler
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImg.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        function clearImage() {
            fileInput.value = '';
            imagePreview.classList.add('hidden');
        }

        // Search Handler
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filteredPosts = allPosts.filter(post => 
                post.text.toLowerCase().includes(query) || 
                post.date.toLowerCase().includes(query)
            );
            renderPosts(filteredPosts);
        });

        // Form Submit
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            
            // Loading State
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Posting...`;

            const formData = new FormData();
            formData.append('text', document.getElementById('postText').value);
            if (fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (res.ok) {
                    // Reset Form
                    document.getElementById('postText').value = '';
                    clearImage();
                    toggleModal(false);
                    loadPosts(); // Refresh feed
                } else {
                    alert(data.error || 'Upload failed');
                }
            } catch (err) {
                console.error(err);
                alert('Error uploading post');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        });

        // Load & Render Posts
        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                allPosts = await res.json();
                renderPosts(allPosts);
            } catch (err) {
                console.error("Failed to load posts");
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('feed');
            const emptyState = document.getElementById('emptyState');
            feed.innerHTML = '';

            if (posts.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');

            posts.forEach(post => {
                const postEl = document.createElement('div');
                postEl.className = 'bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden hover:border-zinc-700 transition animate-fade-in';
                
                let imageHtml = '';
                if (post.image) {
                    imageHtml = `<div class="w-full bg-black flex justify-center border-b border-zinc-800">
                        <img src="${post.image}" class="max-h-[500px] object-contain">
                    </div>`;
                }

                // Check if text is just emoji or short (make it bigger)
                const isShortText = post.text.length < 50 && !post.image;
                const textClass = isShortText ? 'text-xl font-medium text-zinc-200' : 'text-zinc-300';

                postEl.innerHTML = `
                    ${imageHtml}
                    <div class="p-5">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center">
                                <i data-lucide="ghost" class="w-4 h-4 text-zinc-500"></i>
                            </div>
                            <div>
                                <div class="text-sm font-medium text-zinc-200">Anonymous</div>
                                <div class="text-xs text-zinc-500">${post.date}</div>
                            </div>
                        </div>
                        <p class="${textClass} whitespace-pre-wrap">${post.text}</p>
                    </div>
                `;
                feed.appendChild(postEl);
            });
            
            // Re-initialize icons for new elements
            lucide.createIcons();
        }

        // Start
        loadPosts();
    </script>
</body>
</html>
