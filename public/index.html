<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadChats Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #09090b; color: #e4e4e7; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .modal-bg { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); }
        
        /* Drawer Transitions */
        .drawer-panel { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        .drawer-panel.open { transform: translateX(0); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="glass fixed top-0 w-full z-40 px-4 py-3">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Logo -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <i data-lucide="ghost" class="text-emerald-500 w-6 h-6"></i>
                <h1 class="font-bold text-lg tracking-tight">DeadChats<span class="text-emerald-500">Files</span></h1>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-3">
                <button onclick="toggleModal('uploadModal', true)" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-full sm:px-4 sm:py-2 flex items-center gap-2 transition-all shadow-lg shadow-emerald-900/20">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span class="hidden sm:inline text-sm font-medium">New Post</span>
                </button>
                <button onclick="toggleDrawer(true)" class="p-2 hover:bg-zinc-800 rounded-full transition text-zinc-400">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Side Menu Drawer (Fixed Z-Index & Pointer Events) -->
    <div id="menuDrawer" class="fixed inset-0 z-50 pointer-events-none">
        <!-- Backdrop: Added pointer-events-none so it doesn't block clicks when hidden -->
        <div class="absolute inset-0 bg-black/50 transition-opacity opacity-0 pointer-events-none" id="drawerBackdrop" onclick="toggleDrawer(false)"></div>
        
        <!-- Panel -->
        <div class="absolute right-0 top-0 h-full w-64 bg-zinc-900 border-l border-zinc-800 drawer-panel pointer-events-auto p-6 flex flex-col shadow-2xl" id="drawerPanel">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-bold text-xl text-white">Menu</h2>
                <button onclick="toggleDrawer(false)"><i data-lucide="x" class="text-zinc-400 hover:text-white"></i></button>
            </div>
            <div class="space-y-2">
                <a href="/" class="block p-3 rounded-lg hover:bg-zinc-800 text-zinc-300 flex items-center gap-3 transition">
                    <i data-lucide="home" class="w-5 h-5"></i> Home
                </a>
                <button onclick="openLogin()" class="w-full text-left p-3 rounded-lg hover:bg-zinc-800 text-zinc-300 flex items-center gap-3 transition">
                    <i data-lucide="shield" class="w-5 h-5"></i> Login as Admin
                </button>
            </div>
            <div class="mt-auto pt-6 border-t border-zinc-800 text-xs text-zinc-500 text-center">
                DeadChats Files v3.0<br>Temp Storage
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-3xl mx-auto pt-24 px-4 pb-20">
        <!-- Search -->
        <div class="mb-6 relative group">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500 group-focus-within:text-emerald-500 transition"></i>
            <input type="text" id="searchInput" placeholder="Search titles or content..." 
                class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:outline-none focus:border-emerald-500 transition-all placeholder-zinc-600 shadow-sm">
        </div>

        <div id="feed" class="space-y-6">
            <!-- Loading Skeleton -->
            <div class="text-center py-10 text-zinc-600 animate-pulse">
                Loading posts...
            </div>
        </div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-bg transition-opacity" onclick="toggleModal('uploadModal', false)"></div>
        <div class="relative w-full max-w-lg bg-[#09090b] rounded-2xl border border-zinc-800 p-6 shadow-2xl animate-fade-in-up transform transition-all">
            
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white">Create Post</h2>
                <button onclick="toggleModal('uploadModal', false)" class="text-zinc-500 hover:text-white"><i data-lucide="x"></i></button>
            </div>
            
            <form id="uploadForm" class="space-y-4">
                <div>
                    <input type="text" id="postTitle" placeholder="Subject / Title" class="w-full bg-zinc-900 text-white p-3 rounded-xl border border-zinc-800 focus:outline-none focus:border-emerald-500 font-bold placeholder-zinc-600 transition-colors">
                </div>
                
                <div>
                    <textarea id="postText" placeholder="What's on your mind?" class="w-full bg-zinc-900 text-white p-3 rounded-xl border border-zinc-800 focus:outline-none focus:border-emerald-500 resize-none h-32 placeholder-zinc-600 transition-colors"></textarea>
                </div>
                
                <!-- Progress Bar -->
                <div id="progressContainer" class="hidden w-full bg-zinc-800 rounded-full h-1.5 overflow-hidden mt-2">
                    <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <label class="cursor-pointer p-2 hover:bg-zinc-800 rounded-full transition text-zinc-400 hover:text-emerald-400 flex items-center gap-2 group">
                        <input type="file" id="postImage" class="hidden" accept="image/*">
                        <i data-lucide="image" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
                        <span id="fileName" class="text-xs text-zinc-500 group-hover:text-zinc-300 max-w-[100px] truncate hidden sm:block"></span>
                    </label>
                    
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-xl font-medium transition shadow-lg shadow-emerald-900/20 flex items-center gap-2">
                        Post <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-bg" onclick="toggleModal('loginModal', false)"></div>
        <div class="relative w-full max-w-sm bg-[#09090b] rounded-2xl border border-zinc-800 p-6 shadow-2xl transform transition-all">
            <h2 class="text-xl font-bold mb-4 text-white">Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Enter Secret Password" class="w-full bg-zinc-900 p-3 rounded-xl border border-zinc-800 mb-4 text-white focus:border-emerald-500 focus:outline-none">
            <button onclick="loginAdmin()" class="w-full bg-emerald-600 hover:bg-emerald-500 p-3 rounded-xl font-bold text-white transition">Login</button>
        </div>
    </div>

    <script>
        // Icons
        lucide.createIcons();
        
        let allPosts = [];
        let isAdmin = false;

        // Drawer Logic (Fixed)
        function toggleDrawer(open) {
            const drawer = document.getElementById('drawerPanel');
            const backdrop = document.getElementById('drawerBackdrop');
            const container = document.getElementById('menuDrawer');
            
            if(open) {
                // Allow clicks on container
                container.classList.remove('pointer-events-none');
                container.classList.add('pointer-events-auto');
                
                drawer.classList.add('open');
                
                // Show backdrop and let it capture clicks
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
                backdrop.classList.add('pointer-events-auto');
            } else {
                drawer.classList.remove('open');
                
                // Hide backdrop and stop capturing clicks
                backdrop.classList.add('opacity-0', 'pointer-events-none');
                backdrop.classList.remove('pointer-events-auto');
                
                // Stop container from blocking clicks (delayed to let transition finish)
                setTimeout(() => {
                    container.classList.add('pointer-events-none');
                    container.classList.remove('pointer-events-auto');
                }, 300);
            }
        }

        // Modal Logic
        function toggleModal(id, show) {
            const el = document.getElementById(id);
            if(show) {
                el.classList.remove('hidden');
            } else {
                el.classList.add('hidden');
            }
        }

        function openLogin() {
            toggleDrawer(false);
            setTimeout(() => toggleModal('loginModal', true), 300);
        }

        // Image Selection Feedback
        document.getElementById('postImage').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name;
            const label = document.getElementById('fileName');
            if (fileName) {
                label.textContent = fileName;
                label.classList.remove('hidden');
            }
        });

        // Upload Logic
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const bar = document.getElementById('progressBar');
            const barContainer = document.getElementById('progressContainer');
            
            btn.disabled = true;
            btn.innerHTML = 'Uploading...';
            barContainer.classList.remove('hidden');
            
            // Fake progress animation
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if(progress > 90) progress = 90;
                bar.style.width = progress + '%';
            }, 100);

            const formData = new FormData();
            formData.append('title', document.getElementById('postTitle').value);
            formData.append('text', document.getElementById('postText').value);
            const fileInput = document.getElementById('postImage');
            if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                clearInterval(interval);
                bar.style.width = '100%';
                
                if (res.ok) {
                    setTimeout(() => {
                        toggleModal('uploadModal', false);
                        loadPosts();
                        document.getElementById('uploadForm').reset();
                        document.getElementById('fileName').textContent = '';
                        barContainer.classList.add('hidden');
                        bar.style.width = '0%';
                        btn.disabled = false;
                        btn.innerHTML = 'Post <i data-lucide="send" class="w-4 h-4"></i>';
                        lucide.createIcons();
                    }, 600);
                } else {
                    const data = await res.json();
                    alert(data.error || 'Upload failed');
                    btn.disabled = false;
                    btn.innerHTML = 'Post <i data-lucide="send" class="w-4 h-4"></i>';
                    lucide.createIcons();
                }
            } catch (err) {
                console.error(err);
                alert('Server Error');
                btn.disabled = false;
            }
        });

        // Login Logic
        async function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            const data = await res.json();
            if (data.success) {
                isAdmin = true;
                alert("Logged in as Admin!");
                toggleModal('loginModal', false);
                loadPosts(); 
            } else {
                alert("Wrong password!");
            }
        }

        // Search Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allPosts.filter(p => 
                (p.title && p.title.toLowerCase().includes(q)) || 
                (p.text && p.text.toLowerCase().includes(q))
            );
            renderPosts(filtered);
        });

        // Load Posts
        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                allPosts = await res.json();
                renderPosts(allPosts);
            } catch (err) {
                console.log("Loading...");
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            if (posts.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-20 text-zinc-600">
                        <i data-lucide="ghost" class="w-12 h-12 mx-auto mb-3 opacity-20"></i>
                        <p>No posts yet. Be the first!</p>
                    </div>
                `;
            }

            posts.forEach(post => {
                const el = document.createElement('div');
                el.className = 'bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden hover:border-zinc-700 transition animate-fade-in mb-6';
                
                let imgHtml = post.image ? `<div class="bg-black/50 border-b border-zinc-800 flex justify-center"><img src="${post.image}" class="max-h-[600px] w-auto object-contain"></div>` : '';
                
                el.innerHTML = `
                    ${imgHtml}
                    <div class="p-5">
                        <h3 class="font-bold text-xl text-white mb-2 leading-tight">${post.title || 'Untitled'}</h3>
                        <p class="text-zinc-300 text-base mb-4 whitespace-pre-wrap leading-relaxed">${post.text}</p>
                        <div class="flex items-center justify-between pt-4 border-t border-zinc-800/50">
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 rounded-full bg-emerald-900/30 flex items-center justify-center">
                                    <i data-lucide="user" class="w-3 h-3 text-emerald-500"></i>
                                </div>
                                <span class="text-xs text-zinc-500 font-medium">Anonymous</span>
                            </div>
                            <span class="text-xs text-zinc-600 font-mono">${post.date}</span>
                        </div>
                    </div>
                `;
                feed.appendChild(el);
            });
            lucide.createIcons();
        }

        // Auto-load on start
        loadPosts();
    </script>
</body>
</html>
