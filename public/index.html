<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeadChats Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #09090b; color: #e4e4e7; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .modal-bg { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px); }
        .drawer { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        .drawer.open { transform: translateX(0); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="glass fixed top-0 w-full z-40 px-4 py-3">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Logo -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <i data-lucide="ghost" class="text-emerald-500 w-6 h-6"></i>
                <h1 class="font-bold text-lg tracking-tight">DeadChats<span class="text-emerald-500">Files</span></h1>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-3">
                <button onclick="toggleModal('uploadModal', true)" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-full sm:px-4 sm:py-2 flex items-center gap-2 transition-all shadow-lg shadow-emerald-900/20">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span class="hidden sm:inline text-sm font-medium">New Post</span>
                </button>
                <button onclick="toggleDrawer(true)" class="p-2 hover:bg-zinc-800 rounded-full transition text-zinc-400">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Side Menu Drawer -->
    <div id="menuDrawer" class="fixed inset-0 z-50 pointer-events-none">
        <div class="absolute inset-0 bg-black/50 transition-opacity opacity-0 pointer-events-auto" id="drawerBackdrop" onclick="toggleDrawer(false)"></div>
        <div class="absolute right-0 top-0 h-full w-64 bg-zinc-900 border-l border-zinc-800 drawer pointer-events-auto p-6 flex flex-col" id="drawerPanel">
            <div class="flex justify-between items-center mb-8">
                <h2 class="font-bold text-xl">Menu</h2>
                <button onclick="toggleDrawer(false)"><i data-lucide="x" class="text-zinc-400"></i></button>
            </div>
            <div class="space-y-2">
                <a href="#" class="block p-3 rounded-lg hover:bg-zinc-800 text-zinc-300 flex items-center gap-3">
                    <i data-lucide="home" class="w-5 h-5"></i> Home
                </a>
                <button onclick="toggleModal('loginModal', true)" class="w-full text-left p-3 rounded-lg hover:bg-zinc-800 text-zinc-300 flex items-center gap-3">
                    <i data-lucide="shield" class="w-5 h-5"></i> Login as Admin
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-3xl mx-auto pt-24 px-4 pb-20">
        <!-- Search -->
        <div class="mb-6 relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
            <input type="text" id="searchInput" placeholder="Search titles or content..." 
                class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-3 pl-10 pr-4 text-sm focus:outline-none focus:border-emerald-500 transition-all placeholder-zinc-600">
        </div>

        <div id="feed" class="space-y-6"></div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-bg" onclick="toggleModal('uploadModal', false)"></div>
        <div class="relative w-full max-w-lg bg-[#09090b] rounded-2xl border border-zinc-800 p-6 shadow-2xl animate-fade-in-up">
            
            <h2 class="text-xl font-bold mb-4">Create Post</h2>
            
            <form id="uploadForm" class="space-y-4">
                <input type="text" id="postTitle" placeholder="Subject / Title" class="w-full bg-zinc-900 text-white p-3 rounded-xl border border-zinc-800 focus:outline-none focus:border-emerald-500 font-bold">
                
                <textarea id="postText" placeholder="What's on your mind?" class="w-full bg-zinc-900 text-white p-3 rounded-xl border border-zinc-800 focus:outline-none focus:border-emerald-500 resize-none h-24"></textarea>
                
                <!-- Progress Bar -->
                <div id="progressContainer" class="hidden w-full bg-zinc-800 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <label class="cursor-pointer p-2 hover:bg-zinc-800 rounded-full transition text-zinc-400 hover:text-emerald-400">
                        <input type="file" id="postImage" class="hidden" accept="image/*">
                        <i data-lucide="image" class="w-6 h-6"></i>
                    </label>
                    <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-medium">Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 modal-bg" onclick="toggleModal('loginModal', false)"></div>
        <div class="relative w-full max-w-sm bg-[#09090b] rounded-2xl border border-zinc-800 p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Admin Login</h2>
            <input type="password" id="adminPass" placeholder="Enter Secret Password" class="w-full bg-zinc-900 p-3 rounded-xl border border-zinc-800 mb-4 text-white">
            <button onclick="loginAdmin()" class="w-full bg-emerald-600 p-3 rounded-xl font-bold text-white">Login</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let allPosts = [];
        let isAdmin = false;

        function toggleDrawer(open) {
            const drawer = document.getElementById('drawerPanel');
            const backdrop = document.getElementById('drawerBackdrop');
            if(open) {
                drawer.classList.add('open');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                drawer.classList.remove('open');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function toggleModal(id, show) {
            const el = document.getElementById(id);
            if(show) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }

        // Upload Logic with Progress Simulation
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const bar = document.getElementById('progressBar');
            const barContainer = document.getElementById('progressContainer');
            
            btn.disabled = true;
            barContainer.classList.remove('hidden');
            
            // Fake progress animation
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                if(progress > 90) clearInterval(interval);
                bar.style.width = progress + '%';
            }, 200);

            const formData = new FormData();
            formData.append('title', document.getElementById('postTitle').value);
            formData.append('text', document.getElementById('postText').value);
            const fileInput = document.getElementById('postImage');
            if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                clearInterval(interval);
                bar.style.width = '100%';
                
                if (res.ok) {
                    setTimeout(() => {
                        toggleModal('uploadModal', false);
                        loadPosts();
                        document.getElementById('uploadForm').reset();
                        barContainer.classList.add('hidden');
                        bar.style.width = '0%';
                        btn.disabled = false;
                    }, 500);
                } else {
                    alert('Upload failed');
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Error');
                btn.disabled = false;
            }
        });

        async function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            const data = await res.json();
            if (data.success) {
                isAdmin = true;
                alert("Logged in as Admin!");
                toggleModal('loginModal', false);
                toggleDrawer(false);
                loadPosts(); // Reload to show admin buttons (future feature)
            } else {
                alert("Wrong password!");
            }
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allPosts.filter(p => 
                p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q)
            );
            renderPosts(filtered);
        });

        async function loadPosts() {
            const res = await fetch('/api/posts');
            allPosts = await res.json();
            renderPosts(allPosts);
        }

        function renderPosts(posts) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            posts.forEach(post => {
                const el = document.createElement('div');
                el.className = 'bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden hover:border-zinc-700 transition';
                
                let imgHtml = post.image ? `<img src="${post.image}" class="w-full max-h-[500px] object-contain bg-black border-b border-zinc-800">` : '';
                
                el.innerHTML = `
                    ${imgHtml}
                    <div class="p-5">
                        <h3 class="font-bold text-lg text-white mb-1">${post.title || 'Untitled'}</h3>
                        <p class="text-zinc-400 text-sm mb-3 whitespace-pre-wrap">${post.text}</p>
                        <div class="text-xs text-zinc-600 flex justify-between">
                            <span>Anonymous</span>
                            <span>${post.date}</span>
                        </div>
                    </div>
                `;
                feed.appendChild(el);
            });
            lucide.createIcons();
        }

        loadPosts();
    </script>
</body>
</html>
